{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Admin – Tournoi</title>
    <link rel="stylesheet" href="{% static 'tournoi/css/dashboard.css' %}">
    <style>
        /* ======= FOND ANIMÉ ======= */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #1abc9c, #3498db);
            overflow: hidden;
        }

        canvas#bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ======= FORMULAIRE ======= */
        .login-container {
            position: relative;
            z-index: 1; /* au-dessus du canvas */
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .login-container h2 {
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .login-container input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .login-container input:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 8px rgba(26, 188, 156, 0.5);
            outline: none;
        }

        .login-container button {
            width: 100%;
            padding: 12px 0;
            background-color: #1abc9c;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-container button:hover {
            background-color: #16a085;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-container p.message {
            color: red;
            margin-top: -10px;
            margin-bottom: 15px;
            font-size: 14px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="login-container">
    <form method="post">
        {% csrf_token %}
        <h2>Connexion Admin</h2>

        <p style="margin-bottom:20px; color:#555; font-size:15px; line-height:1.5;">
    Cette interface est réservée aux administrateurs du système.  
    Veuillez saisir vos identifiants afin d’accéder à l’espace sécurisé de gestion du tournoi.
</p>

        <input type="text" name="username" placeholder="Utilisateur" required>
        <input type="password" name="password" placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>

        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    </form>
</div>

<script>
/* ===== PARTICULES/BULLES ANIMÉES EN FOND ===== */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const particles = [];
const particleCount = 60;

function random(min, max) {
    return Math.random() * (max - min) + min;
}

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: random(0, width),
        y: random(0, height),
        radius: random(2, 6),
        dx: random(-0.5, 0.5),
        dy: random(-0.5, 0.5),
        alpha: random(0.3, 0.8)
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        // Rebond sur les bords
        if (p.x < 0 || p.x > width) p.dx *= -1;
        if (p.y < 0 || p.y > height) p.dy *= -1;
    }
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});
</script>

</body>
</html>
