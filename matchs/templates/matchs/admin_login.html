{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Premium • Tournoi</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --primary:#2563eb;
            --secondary:#0ea5e9;
            --success:#10b981;
            --dark:#0f172a;
            --light:#f8fafc;
            --border:rgba(255,255,255,.15);
        }

        body{
            font-family:'Poppins',sans-serif;
            height:100vh;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(135deg,#0f172a 0%,#111827 35%,#1e3a8a 100%);
            position:relative;
        }

        /* ===== CANVAS ===== */

        #bgCanvas{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            z-index:1;
        }

        /* ===== GLOW ===== */

        .glow{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:.5;
            z-index:0;
            animation:float 8s ease-in-out infinite;
        }

        .glow.one{
            width:350px;
            height:350px;
            background:#2563eb;
            top:-100px;
            left:-100px;
        }

        .glow.two{
            width:300px;
            height:300px;
            background:#06b6d4;
            bottom:-120px;
            right:-80px;
            animation-delay:2s;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(25px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        /* ===== LOGIN CARD ===== */

        .login-wrapper{
            position:relative;
            z-index:2;
            width:100%;
            max-width:430px;
            padding:20px;
        }

        .login-card{

            position:relative;
            overflow:hidden;

            background:rgba(255,255,255,.08);
            backdrop-filter:blur(22px);

            border:1px solid rgba(255,255,255,.15);

            border-radius:32px;

            padding:45px 38px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.08);

            animation:cardEntrance .9s ease;
        }

        @keyframes cardEntrance{

            0%{
                opacity:0;
                transform:translateY(50px) scale(.9);
            }

            100%{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        /* ===== DECORATION ===== */

        .login-card::before{

            content:'';
            position:absolute;
            width:200px;
            height:200px;
            border-radius:50%;

            background:rgba(255,255,255,.05);

            top:-90px;
            right:-90px;
        }

        .login-card::after{

            content:'';
            position:absolute;
            width:150px;
            height:150px;
            border-radius:50%;

            background:rgba(37,99,235,.18);

            bottom:-70px;
            left:-70px;
        }

        /* ===== HEADER ===== */

        .logo-box{

            width:90px;
            height:90px;

            margin:auto auto 22px;

            border-radius:25px;

            display:flex;
            align-items:center;
            justify-content:center;

            background:linear-gradient(135deg,#2563eb,#06b6d4);

            box-shadow:
                0 10px 25px rgba(37,99,235,.45);

            animation:pulseLogo 2s infinite;
        }

        @keyframes pulseLogo{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.05);
            }

            100%{
                transform:scale(1);
            }
        }

        .logo-box i{
            color:white;
            font-size:38px;
        }

        .login-title{
            text-align:center;
            color:white;
            font-size:2rem;
            font-weight:800;
            margin-bottom:8px;
        }

        .login-subtitle{
            text-align:center;
            color:rgba(255,255,255,.75);
            font-size:14px;
            line-height:1.7;
            margin-bottom:35px;
        }

        /* ===== INPUTS ===== */

        .input-group{
            position:relative;
            margin-bottom:22px;
        }

        .input-group i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:rgba(255,255,255,.65);
            font-size:15px;
        }

        .input-group input{

            width:100%;
            height:58px;

            padding:0 18px 0 52px;

            border-radius:18px;

            border:1px solid rgba(255,255,255,.12);

            background:rgba(255,255,255,.07);

            color:white;
            font-size:15px;

            transition:.3s;
        }

        .input-group input::placeholder{
            color:rgba(255,255,255,.55);
        }

        .input-group input:focus{

            outline:none;

            border-color:#60a5fa;

            background:rgba(255,255,255,.10);

            box-shadow:
                0 0 0 4px rgba(96,165,250,.15);
        }

        /* ===== BUTTON ===== */

        .btn-login{

            width:100%;
            height:58px;

            border:none;
            border-radius:18px;

            background:linear-gradient(135deg,#2563eb,#06b6d4);

            color:white;
            font-size:16px;
            font-weight:700;

            cursor:pointer;

            transition:.35s;

            box-shadow:
                0 12px 30px rgba(37,99,235,.35);
        }

        .btn-login:hover{

            transform:translateY(-3px);

            box-shadow:
                0 18px 35px rgba(37,99,235,.45);
        }

        .btn-login i{
            margin-right:8px;
        }

        /* ===== MESSAGE ===== */

        .message{

            margin-top:18px;

            background:rgba(239,68,68,.18);

            border:1px solid rgba(239,68,68,.35);

            color:#fecaca;

            padding:14px;
            border-radius:14px;

            font-size:14px;

            animation:fadeIn .5s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* ===== FOOTER ===== */

        .footer-note{
            text-align:center;
            margin-top:22px;
            color:rgba(255,255,255,.6);
            font-size:13px;
        }

        /* ===== RESPONSIVE ===== */

        @media(max-width:500px){

            .login-card{
                padding:35px 24px;
                border-radius:24px;
            }

            .login-title{
                font-size:1.7rem;
            }

            .logo-box{
                width:75px;
                height:75px;
            }

            .logo-box i{
                font-size:30px;
            }

        }

    </style>
</head>

<body>

<!-- BACKGROUND -->
<canvas id="bgCanvas"></canvas>

<div class="glow one"></div>
<div class="glow two"></div>

<!-- LOGIN -->
<div class="login-wrapper">

    <div class="login-card">

        <div class="logo-box">
            <i class="fas fa-trophy"></i>
        </div>

        <h1 class="login-title">
            Connexion Admin
        </h1>

        <p class="login-subtitle">
            Accédez à l’espace sécurisé de gestion du tournoi,
            des équipes, des matchs et des statistiques.
        </p>

        <form method="post">

            {% csrf_token %}

            <!-- USERNAME -->
            <div class="input-group">

                <i class="fas fa-user"></i>

                <input type="text"
                       name="username"
                       placeholder="Nom d'utilisateur"
                       required>

            </div>

            <!-- PASSWORD -->
            <div class="input-group">

                <i class="fas fa-lock"></i>

                <input type="password"
                       name="password"
                       placeholder="Mot de passe"
                       required>

            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Se connecter
            </button>

            <!-- DJANGO MESSAGES -->
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}

        </form>

        <div class="footer-note">
            © 2026 • Système Premium de Gestion du Tournoi
        </div>

    </div>

</div>

<!-- PARTICLES -->
<script>

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const particles = [];

for(let i = 0; i < 90; i++){

    particles.push({

        x:Math.random() * w,
        y:Math.random() * h,

        radius:Math.random() * 3 + 1,

        speedX:(Math.random() - .5) * .7,
        speedY:(Math.random() - .5) * .7,

        opacity:Math.random()

    });

}

function drawParticles(){

    ctx.clearRect(0,0,w,h);

    particles.forEach(p => {

        ctx.beginPath();

        ctx.arc(p.x,p.y,p.radius,0,Math.PI * 2);

        ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;

        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if(p.x < 0 || p.x > w) p.speedX *= -1;
        if(p.y < 0 || p.y > h) p.speedY *= -1;

    });

    connectParticles();

    requestAnimationFrame(drawParticles);
}

function connectParticles(){

    for(let a = 0; a < particles.length; a++){

        for(let b = a; b < particles.length; b++){

            let dx = particles[a].x - particles[b].x;
            let dy = particles[a].y - particles[b].y;

            let distance = dx * dx + dy * dy;

            if(distance < 12000){

                ctx.beginPath();

                ctx.strokeStyle = 'rgba(255,255,255,.05)';

                ctx.lineWidth = 1;

                ctx.moveTo(particles[a].x, particles[a].y);

                ctx.lineTo(particles[b].x, particles[b].y);

                ctx.stroke();
            }
        }
    }
}

drawParticles();

window.addEventListener('resize', () => {

    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;

});

</script>

</body>
</html>
