{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Ajouter médias</title>

<link rel="stylesheet" href="{% static 'tournoi/css/admin_dashboard.css' %}">

<style>

.container-media{
width:700px;
margin:40px auto;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* TITRES DE CHAMPS PLUS VISIBLES */

.form-group{
margin-bottom:25px;
}

.form-group label{

display:block;
font-size:15px;
font-weight:700;
color:#2c3e50;
margin-bottom:8px;
letter-spacing:0.5px;

}

/* CHAMPS */

.form-group input,
.form-group select{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
transition:0.3s;

}

/* effet focus */

.form-group input:focus,
.form-group select:focus{

border-color:#3498db;
outline:none;
box-shadow:0 0 5px rgba(52,152,219,0.4);

}

/* bouton upload */

.btn-submit{

background:#2ecc71;
color:white;
border:none;
padding:12px 22px;
border-radius:6px;
cursor:pointer;
font-size:15px;
font-weight:bold;

}

.btn-submit:hover{
background:#27ae60;
}

/* bouton retour */

.btn-back{

display:inline-block;
margin-bottom:20px;
text-decoration:none;
background:#3498db;
color:white;
padding:8px 15px;
border-radius:5px;

}

.btn-back:hover{
background:#2980b9;
}

/* titre page */

h2{

margin-bottom:25px;
color:#2c3e50;
border-bottom:2px solid #eee;
padding-bottom:10px;

}

</style>

</head>

<body>

<div class="container-media">

<a href="{% url 'admin_dashboard' %}" class="btn-back">⬅ Retour Dashboard</a>

<h2>📸 Ajouter Photos / Vidéos</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">
<label>Titre du média</label>
<input type="text" name="titre">
</div>

<div class="form-group">
<label>Type de média</label>

<select name="type_media">

<option value="photo">Photo</option>
<option value="video">Vidéo</option>

</select>

</div>

<div class="form-group">
<label>Sélectionner fichiers</label>
<input type="file" name="medias" multiple>
</div>

<button type="submit" class="btn-submit">
⬆️ Uploader
</button>

</form>

</div>

</body>
</html>
