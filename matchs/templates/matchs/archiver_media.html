{% load static %}

<h2>🗂 Médias archivés</h2>

<div class="media-grid">

{% for media in medias %}

<div class="media-card">

{% if media.type_media == "photo" %}
<img src="{{ media.image.url }}">

{% elif media.type_media == "video" %}
<video controls>
<source src="{{ media.video.url }}">
</video>
{% endif %}

<p>{{ media.titre }}</p>

</div>

{% empty %}

<p>Aucune archive disponible</p>

{% endfor %}

</div>
