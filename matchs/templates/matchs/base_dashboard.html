<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{% block title %}Dashboard{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f4f6fb;
}

/* LAYOUT */
.wrapper{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    background:#111827;
    color:white;
    min-height:100vh;
    padding:20px;
    transition:0.3s;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    padding:12px;
    color:#cbd5e1;
    text-decoration:none;
    border-radius:8px;
    margin-bottom:8px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#4f46e5;
    color:white;
}

/* CONTENT */
.content{
    flex:1;
    padding:20px;
}

/* HEADER */
.header{
    background:white;
    padding:15px 20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* CARDS */
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

/* ANIMATION */
.fade-in{
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<div class="wrapper">

    {% include "includes/sidebar.html" %}

    <div class="content">

        {% include "includes/header.html" %}
        {% include "includes/messages.html" %}

        <div class="fade-in">
            {% block body %}{% endblock %}
        </div>

    </div>

</div>

</body>
</html>
