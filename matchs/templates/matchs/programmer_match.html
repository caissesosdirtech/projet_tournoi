{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Programmer un match</title>
    <link rel="stylesheet" href="{% static 'tournoi/css/dashboard.css' %}">
</head>
<body>

<header class="header admin-header">
    <h1>➕ Programmer un match</h1>
</header>

<div class="container">
<main class="content">

<form method="post" class="form-box">
    {% csrf_token %}

    <label>Équipe A</label>
    <select name="equipe1" required>
        {% for e in equipes %}
            <option value="{{ e.id }}">{{ e.nom }}</option>
        {% endfor %}
    </select>

    <label>Équipe B</label>
    <select name="equipe2" required>
        {% for e in equipes %}
            <option value="{{ e.id }}">{{ e.nom }}</option>
        {% endfor %}
    </select>

    <label>Stade</label>
    <input type="text" name="stade" placeholder="Nom du stade" required>

    <label>Date & Heure</label>
    <input type="datetime-local" name="date" required>

    <button type="submit" class="btn">
        📅 Programmer
    </button>

</form>

</main>
</div>
</body>
</html>
