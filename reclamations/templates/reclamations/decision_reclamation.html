{% load static %}

{% block content %}

<style>

/* ================= BACKGROUND ================= */

body{
    background:#f4f6fb;
}

/* ================= CONTAINER ================= */

.container{
    max-width:650px;
    margin:40px auto;
    background:white;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
    overflow:hidden;
    animation:fadeIn 0.6s ease;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#4b367c,#6c5ce7);
    padding:20px;
    color:white;
}

.header h2{
    margin:0;
    font-size:20px;
}

/* BODY */
.body{
    padding:25px;
}

/* LABEL */
label{
    font-weight:600;
    font-size:13px;
    color:#333;
}

/* INPUTS */
select, textarea, input{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:18px;
    border-radius:10px;
    border:1px solid #e0e0e0;
    outline:none;
    transition:0.3s;
    font-size:14px;
}

select:focus, textarea:focus, input:focus{
    border-color:#6c5ce7;
    box-shadow:0 0 0 3px rgba(108,92,231,0.15);
}

/* TEXTAREA */
textarea{
    min-height:120px;
    resize:vertical;
}

/* BUTTON */
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#4b367c,#6c5ce7);
    color:white;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(108,92,231,0.3);
}

/* STATUS PREVIEW */
.status-preview{
    padding:10px 15px;
    border-radius:10px;
    display:inline-block;
    font-size:12px;
    font-weight:600;
    margin-bottom:15px;
}

.en_attente{ background:#ffeaa7; color:#6c5ce7; }
.en_cours{ background:#74b9ff; color:white; }
.traitee{ background:#55efc4; }

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

<div class="container">

<!-- ================= HEADER ================= -->
<div class="header">
    <h2>⚙️ Traitement du recours</h2>
</div>

<div class="body">

<!-- ================= STATUS ACTUEL ================= -->
{% if reclamation %}
    <div class="status-preview {{ reclamation.statut }}">
        Statut actuel : {{ reclamation.get_statut_display }}
    </div>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- STATUT -->
    <label>Changer le statut</label>
    {{ form.statut }}

    <!-- DECISION -->
    <label>Décision de l’admin</label>
    {{ form.decision }}

    <!-- DOCUMENT FINAL -->
    <label>Document final (optionnel)</label>
    {{ form.document_final }}

    <button type="submit">💾 Valider le traitement</button>
</form>

</div>

</div>

{% endblock %}
