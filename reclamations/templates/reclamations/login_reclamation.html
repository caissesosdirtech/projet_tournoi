{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion Recours</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

/* ================= BACKGROUND STADE ================= */

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
        url("{% static 'tournoi/img/stadium2.jpg' %}") center/cover no-repeat;

    overflow:hidden;
    position:relative;
}

/* overlay léger premium */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(2px);

    z-index:1;
}

/* ================= LIGHT GLOW ================= */

.glow{
    position:absolute;
    width:500px;
    height:500px;

    background:rgba(108,92,231,0.25);
    filter: blur(120px);

    border-radius:50%;
    top:-150px;
    left:-150px;

    z-index:1;
}

/* ================= LOGIN CARD ================= */

.login-card{
    position:relative;
    z-index:2;

    width:440px;
    padding:40px;

    border-radius:20px;

    background:rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 25px 70px rgba(0,0,0,0.6);

    text-align:center;
}

/* ================= LOGO ================= */

.logo img{
    width:150px;
    margin-bottom:15px;
}

.title{
    color:#ffffff;
    font-size:18px;
    font-weight:600;
    margin-bottom:20px;
    opacity:0.9;
}

/* ================= TITRE ================= */

h2{
    color:#ffffff;
    font-size:22px;
    font-weight:700;
    margin-bottom:8px;
}

.subtitle{
    color:#cfcfe6;
    font-size:13px;
    margin-bottom:25px;
}

/* ================= ALERT ================= */

.alert{
    background:rgba(255,80,80,0.15);
    color:#ffb3b3;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:15px;
}

/* ================= INPUTS ================= */

.input-group{
    position:relative;
    margin-bottom:18px;
    text-align:left;
}

.input-group input{
    width:100%;
    padding:13px 12px;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.18);

    background:rgba(255,255,255,0.06);
    color:white;

    outline:none;
    font-size:14px;

    transition:0.25s;
}

.input-group input:focus{
    border-color:#6c5ce7;
    box-shadow:0 0 0 3px rgba(108,92,231,0.2);
}

/* FLOAT LABEL */

.input-group label{
    position:absolute;
    left:12px;
    top:13px;

    color:#b8b8c6;
    font-size:13px;

    pointer-events:none;
    transition:0.2s;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label{
    top:-8px;
    left:10px;
    font-size:11px;
    color:#6c5ce7;
    background:#0d0d14;
    padding:0 6px;
}

/* ================= BUTTON ================= */

.btn{
    width:100%;
    padding:13px;

    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#6c5ce7,#4b367c);
    color:white;

    font-weight:600;
    font-size:14px;

    cursor:pointer;

    transition:0.25s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(108,92,231,0.3);
}

/* ================= INFO ================= */

.info{
    margin-top:18px;
    font-size:12px;
    color:#b0b0c3;
}

/* ================= RESPONSIVE ================= */

@media(max-width:500px){
    .login-card{
        width:90%;
        padding:30px;
    }
}

</style>

</head>

<body>

<div class="glow"></div>

<div class="login-card">

    <div class="logo">
        <img src="{% static 'tournoi/img/logo_tournoi.png' %}">
    </div>

    <div class="title">Tournoi Inter-Service DRN</div>

    <h2>Accès Recours</h2>
    <p class="subtitle">Connexion officielle des capitaines et coachs</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <input type="text" name="username" placeholder=" " required>
            <label>Nom d'utilisateur</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder=" " required>
            <label>Mot de passe</label>
        </div>

        <button type="submit" class="btn">Se connecter</button>
    </form>

    <p class="info">
        Accès sécurisé - Système officiel du tournoi DRN
    </p>

</div>

</body>
</html>
