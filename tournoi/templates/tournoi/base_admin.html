{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Tournoi DRN{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'tournoi/css/admin_dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'tournoi/css/modals.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="admin-wrapper">
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <h1>🏆 Admin Tournament Panel</h1>
            <span>Gestion complète du tournoi</span>
        </div>
        <div class="header-user">
            <div class="user-info">
                <strong>Super Admin</strong><br>
                <small>Administration</small>
            </div>
            <a href="{% url 'admin_logout' %}" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </div>
    </header>

    
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
